; Xiegu G90, corrected against the transceiver.
;
; Derived from the catalogue file by Kuba SP5NZF, itself derived from the
; IC-7100 file by Bob Wilson N6TV. Two kinds of change were made and both are
; measured rather than inferred.
;
; The five mode commands other than FM carry a filter byte that the catalogue
; file states in the command and omits from the validation pattern beside it.
; The interface returns the whole command, so the pattern is never found and
; every mode change waits out its timeout. The measured exchange is fourteen
; bytes: eight of returned command and six of acknowledgement.
;
; The behaviour section states what the format has no other place for. The
; timeout is eight times the longest exchange measured through a converter with
; its batching timer at the factory value of sixteen milliseconds; lowering that
; timer in the port properties shortens every exchange by about half.
;
; Whether the interface returns the command is deliberately not stated. The reply
; lengths and the patterns below say it already, and a second statement of the
; same fact could only contradict the first.

;-------------------------------------------------------------------------------
;                               set frequency
;-------------------------------------------------------------------------------
[pmFreq]
Command=FEFE88E0.05.0000000000.FD
Value=5|5|vfBcdLU|1|0
ReplyLength=17
Validate=FEFE88E0050000000000FD.FEFEE088FBFD

[pmFreqA]
; the transceiver addresses only the oscillator in use

[pmFreqB]
; the transceiver addresses only the oscillator in use

[pmRitOffset]
; the transceiver has no incremental tuning over the interface

[pmRit0]
; the transceiver has no incremental tuning over the interface

[pmPitch]
; the sidetone frequency reads as a constant whatever it is set to

