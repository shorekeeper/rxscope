[pmVfoBB]
; the transceiver addresses split by the pair above rather than individually

[pmRitOn]
; the transceiver has no incremental tuning over the interface

[pmRitOff]
; the transceiver has no incremental tuning over the interface

[pmXitOn]
; the transceiver has no incremental tuning over the interface

[pmXitOff]
; the transceiver has no incremental tuning over the interface

[pmRx]
