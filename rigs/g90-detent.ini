ReplyLength=14
Validate=FEFE88E01C0000FD.FEFEE088FBFD

[pmTx]
Command=FEFE88E0.1C00.01.FD
ReplyLength=14
Validate=FEFE88E01C0001FD.FEFEE088FBFD

;-------------------------------------------------------------------------------
;                                 set mode
;
; The filter byte is part of the command and is therefore part of the returned
; command. The catalogue file states it in one place and not the other, which is
; the correction made here.
;-------------------------------------------------------------------------------
[pmCW_U]
; reversed sideband
Command=FEFE88E0.06.07.01.FD
ReplyLength=14
Validate=FEFE88E0060701FD.FEFEE088FBFD

[pmCW_L]
; normal sideband
Command=FEFE88E0.06.03.01.FD
ReplyLength=14
Validate=FEFE88E0060301FD.FEFEE088FBFD

[pmSSB_U]
Command=FEFE88E0.06.01.01.FD
ReplyLength=14
Validate=FEFE88E0060101FD.FEFEE088FBFD

[pmSSB_L]
Command=FEFE88E0.06.00.01.FD
ReplyLength=14
Validate=FEFE88E0060001FD.FEFEE088FBFD

[pmAM]
Command=FEFE88E0.06.02.01.FD
ReplyLength=14
Validate=FEFE88E0060201FD.FEFEE088FBFD

[pmFM]
; stated without a filter byte in the catalogue file and accepted as such
Command=FEFE88E0.06.05.FD
ReplyLength=13
Validate=FEFE88E00605FD.FEFEE088FBFD

[pmDIG_U]
; the transceiver has no data mode over the interface

[pmDIG_L]
; the transceiver has no data mode over the interface

;-------------------------------------------------------------------------------
;                               read status
;-------------------------------------------------------------------------------
[STATUS1]
; frequency of the oscillator in use
Command=FEFE88E0.03.FD
ReplyLength=17
Validate=FEFE88E003FD.FEFEE088.03.0000000000.FD
Value1=11|5|vfBcdLU|1|0|pmFreq

[STATUS2]
; mode of the oscillator in use
Command=FEFE88E0.04.FD
ReplyLength=14
Validate=FEFE88E004FD.FEFEE088.04.0000.FD
Flag1=000000000000.0000000000.FF.0000|000000000000.0000000000.07.0000|pmCW_U
Flag2=000000000000.0000000000.FF.0000|000000000000.0000000000.03.0000|pmCW_L
Flag3=000000000000.0000000000.FF.0000|000000000000.0000000000.01.0000|pmSSB_U
Flag4=000000000000.0000000000.FF.0000|000000000000.0000000000.00.0000|pmSSB_L
Flag5=000000000000.0000000000.FF.0000|000000000000.0000000000.02.0000|pmAM
Flag6=000000000000.0000000000.FF.0000|000000000000.0000000000.05.0000|pmFM

[STATUS3]
; transmit state
Command=FEFE88E0.1C00.FD
ReplyLength=15
Validate=FEFE88E01C00FD.FEFEE088.1C00.00.FD
Flag1=00000000000000.00000000.0000.01.00|pmTx
Flag2=00000000000000.00000000.0000.0F.00|00000000000000.00000000.0000.00.00|pmRx

;-------------------------------------------------------------------------------
;                               behaviour
;-------------------------------------------------------------------------------
[DETENT]
; The longest exchange measured was twenty five milliseconds through a converter
; batching at sixteen. Eight times that leaves room for a slower converter and is
; still short enough that a stalled link is noticed within a second.
TimeoutMs=200
; Three status commands at eight passes per second is twenty four exchanges, well
; inside what the transceiver answered without complaint.
MaxPollHz=8